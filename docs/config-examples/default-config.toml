# Place a copy of this config to ~/.config/inlay/inlay.toml (or ~/.inlay.toml, but not both)
# After that, you can edit it to your liking
#
# Inlay is a fork of AeroSpace and, for now, uses the same config format.
# The links below point to the AeroSpace documentation.

# Config version for compatibility and deprecations
# See: https://nikitabobko.github.io/AeroSpace/guide#config-version
# Fallback value (if you omit the key): config-version = 1
config-version = 2

# You can use it to add commands that run after Inlay startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start Inlay at login
start-at-login = false

# Automatically reload the config when the config file is saved
# After setting this to true, reload once manually to start the auto-reloading
auto-reload-config = false

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# Possible values: tiles
# Inlay has no accordion layout. 'accordion' and the 'accordion-padding' key of AeroSpace are accepted
# with a warning: 'accordion' is treated as 'tiles', and 'accordion-padding' is ignored
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# List of workspaces that should stay alive even when they contain no windows,
# even when they are invisible.
# This config option is only available since 'config-version = 2'
# Fallback value (if you omit the key): persistent-workspaces = []
# Only 1-6: every persistent workspace takes room in the menu bar item, and the item of a long list
# doesn't fit next to the notch of a laptop. The other workspaces (alt-7 ... alt-9 and alt-a ... alt-z below)
# still work: a workspace exists while it has windows or it is the visible one, and the item shows it then
persistent-workspaces = ["1", "2", "3", "4", "5", "6"]

# A callback that runs every time binding mode changes
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
on-mode-changed = []

focus-follows-mouse.enabled = false

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
# The window borders (see [borders] below) are drawn outside of the windows, in the gaps: with the default
# border of 4 points, 14 points of gap leave 6 points of air between the borders of two neighbor windows.
# Keep the gaps at least twice as big as borders.width, or the borders of neighbor windows touch.
# The outer gaps must be at least as big as borders.width, or the border is cut by the edge of the screen
# Fallback value (if you omit the keys): 0
gaps.inner.horizontal = 14
gaps.inner.vertical =   14
gaps.outer.left =       14
gaps.outer.bottom =     14
gaps.outer.top =        14
gaps.outer.right =      14

# Where the tiling windows are placed
[tiling]
    # Possible values: dwindle|after-focused
    # - dwindle.       The new window splits the focused window in two (inspired by the dwindle layout of Hyprland).
    #                  A window wider than tall is split side by side, otherwise the two windows are stacked.
    #                  The new window is the right/bottom one.
    #                  When a window is closed, its neighbor gets the space back.
    # - after-focused. AeroSpace behavior. The new window is placed after the focused window in the same container,
    #                  and all the windows of the container share the space.
    # Fallback value (if you omit the key): new-window-placement = 'dwindle'
    new-window-placement = 'dwindle'

    # Only for 'dwindle'. The fraction of its space that the split window keeps.
    # 0.5 = two halves. 0.6 = the split window keeps 60%, the new window gets 40%
    # Possible values: 0.1 ... 0.9
    # Fallback value (if you omit the key): split-ratio = 0.5
    split-ratio = 0.5

    # Only for 'dwindle'. Which window the new window splits.
    # Possible values: focused|cursor
    # - focused. The focused window. If it isn't a tiling window of the workspace (it floats, or the new window
    #            goes to another workspace), the most recently used tiling window of the workspace.
    # - cursor.  The tiling window under the mouse cursor, like Hyprland. If there is none (the cursor is in a gap,
    #            on another monitor, over a fullscreen window, or the workspace isn't visible), the same as 'focused'.
    # Fallback value (if you omit the key): split-target = 'focused'
    split-target = 'focused'

    # How the windows that are already open when Inlay starts (or when 'enable on' resumes it) are arranged,
    # in every workspace. The windows that are opened later follow 'new-window-placement'
    # Possible values: grid|row|dwindle
    # - grid.    A balanced grid: ceil(sqrt(n)) columns for n windows, and as many rows as needed.
    #            The windows of the last row share its width: 5 windows are 3 on top of 2.
    # - row.     One row. All the windows get the same width.
    # - dwindle. No arrangement: the windows are placed one after another, like new windows. With
    #            new-window-placement = 'dwindle' that is a spiral, and the last windows are small.
    # Fallback value (if you omit the key): startup-layout = 'grid'
    startup-layout = 'grid'

    # The smallest width and height, in points, that resizing leaves to a tiling window. The 'resize' command and
    # dragging an edge with the mouse stop there: the window isn't shrunk further, and its neighbors aren't either
    # when it is the window that grows. Reaching the limit isn't an error: 'resize' still exits with 0.
    # It only limits resizing. When the windows of a workspace don't fit with this size (many windows on a small
    # monitor), the layout still gives every window its part, however small
    # Possible values: 20 ... 500
    # Fallback value (if you omit the key): min-window-size = 100
    min-window-size = 100

# The menu bar item
[menu-bar]
    # Show the menu bar item. With 'false' Inlay keeps working: use the key bindings and the CLI
    # Fallback value (if you omit the key): enabled = true
    enabled = true

    # The shape of the item. All the existing workspaces are shown, and the focused one is marked
    # Possible values: chips|chips-icons|square|minimal
    # - chips.       The workspaces alone. The ones with windows have a faint background,
    #                the focused one has a solid background, and the empty ones are dimmed.
    # - chips-icons. chips + the icons of the apps of every workspace.
    # - square.      The layout icon, the names of the workspaces, and a square in place of the focused workspace.
    #                In a binding mode other than 'main' the square shows the initial of the mode.
    # - minimal.     Only the focused workspace.
    # Fallback value (if you omit the key): theme = 'chips'
    theme = 'chips'

    # Show the icons of the apps next to the name of every workspace (up to 3 icons and '+n').
    # If you omit the key, the theme decides: true in 'chips-icons', false in the other themes
    # show-app-icons = false

    # Draw the workspaces without windows fainter
    # Fallback value (if you omit the key): dim-empty-workspaces = true
    dim-empty-workspaces = true

    # Show a badge with the initial of the binding mode when the mode isn't 'main'.
    # The 'square' theme always shows the mode in its square
    # Fallback value (if you omit the key): show-mode = false
    show-mode = false

    # Colors of the item.
    # Possible values:
    # - '#RRGGBB' or '#RRGGBBAA'
    # - 'system-accent'. System Settings -> Appearance -> Accent color
    # - 'auto'.          The color of the menu bar text: white on a dark menu bar, black on a light one.
    #                    Not available for 'accent'
    # With a fixed color in 'focused', the name of the workspace is drawn in black or white,
    # whichever has more contrast. 'occupied' is the color of the name and, at 16%, of its background.
    # A fixed color doesn't adapt to the menu bar
    [menu-bar.colors]
        accent = 'system-accent' # The mode badge
        focused = 'auto'         # The background of the focused workspace
        occupied = 'auto'        # The workspaces with windows
        empty = 'auto'           # The workspaces without windows

# The borders of the windows
[borders]
    # Draw a border around every normal window of the visible workspaces, tiling or floating.
    # No border for: fullscreen windows (the fullscreen of Inlay and the native one of macOS),
    # minimized windows, windows of hidden apps, popups, and the dialogs and sheets that float on their own
    # (what Inlay detects as a dialog: see 'inlay debug-windows'). A normal window that you make floating,
    # with 'layout floating' or with an 'on-window-detected' rule, keeps its border
    # Fallback value (if you omit the key): enabled = true
    enabled = true

    # The thickness of the border, in points. The border is drawn outside of the frame of the window:
    # it never covers the content of the window, it takes a part of the gap. See the gaps above
    # Possible values: 1 ... 20
    # Fallback value (if you omit the key): width = 4
    width = 4

    # The radius of the corners, in points. Inlay can't read the real radius of the windows of other apps,
    # so tune it by eye. 16 is close to the windows of macOS 26 and later, 10 to the ones of macOS 14 and 15.
    # 0 = square corners
    # Possible values: 0 ... 40
    # Fallback value (if you omit the key): corner-radius = 16
    corner-radius = 16

    # Colors.
    # Possible values:
    # - '#RRGGBB' or '#RRGGBBAA'
    # - 'system-accent'. System Settings -> Appearance -> Accent color
    # A fully transparent color ('#00000000') means "no border":
    # with inactive-color = '#00000000' only the focused window has a border
    active-color = 'system-accent' # The focused window, if it is a tiling one
    inactive-color = '#8E8E9373'   # The windows that aren't focused
    floating-color = '#BF5AF2'     # The focused window, if it is a floating one

    # A glow around the focused window: a halo of the color of its border (the active, the floating or the mode
    # color) that fades out outwards, outside of the border. The windows that aren't focused never glow
    # Fallback value (if you omit the key): glow = false
    glow = false

    # The blur radius of the glow, in points: about how far from the border the glow reaches. It is drawn
    # over whatever is around the window: the gaps and, if it is wide enough, the edges of the neighbor windows
    # Possible values: 1 ... 40
    # Fallback value (if you omit the key): glow-radius = 12
    glow-radius = 12

    # The color of the border of the focused window while a binding mode is active.
    # It wins over active-color and floating-color. A mode without an entry keeps the normal color.
    # Empty by default
    [borders.mode-colors]
        # resize = '#30D158'
        # service = '#FF453A'

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # alt-enter = '''exec-and-forget osascript -e \
    # 'tell application "Terminal" to tell (do script) to activate' '''

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    alt-slash = 'layout tiles horizontal vertical'

    # See: https://nikitabobko.github.io/AeroSpace/commands#balance-sizes
    # All the windows of the workspace get the same share of their containers again, after resizing them.
    # In AeroSpace the comma key (alt-comma) switched to the accordion layout, which Inlay doesn't have
    cmd-alt-comma = 'balance-sizes'

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-a = 'workspace A' # In your config, you can drop workspace bindings that you don't need
    alt-b = 'workspace B'
    alt-c = 'workspace C'
    alt-d = 'workspace D'
    alt-e = 'workspace E'
    alt-f = 'workspace F'
    alt-g = 'workspace G'
    alt-i = 'workspace I'
    alt-m = 'workspace M'
    alt-n = 'workspace N'
    alt-o = 'workspace O'
    alt-p = 'workspace P'
    alt-q = 'workspace Q'
    alt-r = 'workspace R'
    alt-s = 'workspace S'
    alt-t = 'workspace T'
    alt-u = 'workspace U'
    alt-v = 'workspace V'
    alt-w = 'workspace W'
    alt-x = 'workspace X'
    alt-y = 'workspace Y'
    alt-z = 'workspace Z'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-a = 'move-node-to-workspace A'
    alt-shift-b = 'move-node-to-workspace B'
    alt-shift-c = 'move-node-to-workspace C'
    alt-shift-d = 'move-node-to-workspace D'
    alt-shift-e = 'move-node-to-workspace E'
    alt-shift-f = 'move-node-to-workspace F'
    alt-shift-g = 'move-node-to-workspace G'
    alt-shift-i = 'move-node-to-workspace I'
    alt-shift-m = 'move-node-to-workspace M'
    alt-shift-n = 'move-node-to-workspace N'
    alt-shift-o = 'move-node-to-workspace O'
    alt-shift-p = 'move-node-to-workspace P'
    alt-shift-q = 'move-node-to-workspace Q'
    alt-shift-r = 'move-node-to-workspace R'
    alt-shift-s = 'move-node-to-workspace S'
    alt-shift-t = 'move-node-to-workspace T'
    alt-shift-u = 'move-node-to-workspace U'
    alt-shift-v = 'move-node-to-workspace V'
    alt-shift-w = 'move-node-to-workspace W'
    alt-shift-x = 'move-node-to-workspace X'
    alt-shift-y = 'move-node-to-workspace Y'
    alt-shift-z = 'move-node-to-workspace Z'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
