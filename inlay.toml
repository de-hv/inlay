# The config of Inlay.
#
# This file is the config that Inlay ships with: './install.sh' copies it to ~/.config/inlay/inlay.toml when
# you have no config yet, and Inlay falls back to the copy inside the app when it finds no config at all.
# Edit your copy to your liking: Inlay reloads it when you save it (see 'auto-reload-config' below), and the
# Settings window edits the same file.
#
# Every key, with its possible values and its default:  inlay config --explain [<key>]
# (the same text is in docs/config-reference.toml)

# ┌──────────────────────────────────────────────────────────────────────────────┐
#                                    DEFAULTS
# └──────────────────────────────────────────────────────────────────────────────┘
config-version = 2

# Commands that run after Inlay starts
after-startup-command = []

# Start Inlay at login
start-at-login = true

# Reload the config when the config file is saved. It also keeps the Settings window, the menu bar item and
# the borders in sync with what you write here by hand
auto-reload-config = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Possible values: tiles
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'horizontal'

# The mouse follows the focus when the focused monitor or the focused window changes
# Drop them from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
automatically-unhide-macos-hidden-apps = false

# ┌──────────────────────────────────────────────────────────────────────────────┐
#                                    WORKSPACES
# └──────────────────────────────────────────────────────────────────────────────┘
# Named by number, as the menu bar item shows them. The keys are on the right
# hand: the first three workspaces on the home row, where the fingers rest
# (index, middle, ring), and the other four on the row above:
#
#   u i o p   ->   7 4 5 6
#   j k l     ->   1 2 3
#
#   "1" = Terminal    cmd-alt-ctrl-j  (move a window: cmd-alt-shift-j)
#   "2" = Code        cmd-alt-ctrl-k  (cmd-alt-shift-k)
#   "3" = Browser     cmd-alt-ctrl-l  (cmd-alt-shift-l)
#   "4" = Chat        cmd-alt-ctrl-i  (cmd-alt-shift-i)
#   "5" = AI          cmd-alt-ctrl-o  (cmd-alt-shift-o)
#   "6" = Other       cmd-alt-ctrl-p  (cmd-alt-shift-p)   every app without a workspace,
#                                                         on the secondary display if there is one
#   "7" = Empty       cmd-alt-ctrl-7  (cmd-alt-shift-7)   no app goes there on its own: a workspace
#                                                         that is (almost) always free, on the main display
#
# cmd-alt-ctrl / cmd-alt-shift rather than anything shorter, so no other app's
# shortcut ever collides with them.
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7"]

# 8 points around the edges of the screen and 8 between two windows.
# The window borders (see [borders] below) are drawn outside of the windows, in the gaps: keep the gaps at
# least twice as big as borders.width, or the borders of two neighbor windows overlap. With the gaps of 8
# and the default border of 4 they touch; a border of 2 or 3, or gaps of 14, leave air between them
[gaps]
    inner.horizontal = 8
    inner.vertical =   8
    outer.left =       8
    outer.right =      8
    outer.top =        8
    outer.bottom =     8
    # A single tiling window takes the whole screen, without the outer gaps and without a border
    smart = true

# ┌──────────────────────────────────────────────────────────────────────────────┐
#                                    TILING
# └──────────────────────────────────────────────────────────────────────────────┘
# Where the tiling windows are placed. See: inlay config --explain tiling
[tiling]
    # dwindle: the new window splits the focused one in two. after-focused: the behavior of AeroSpace
    new-window-placement = 'dwindle'
    # The fraction of its space that the split window keeps (0.1 ... 0.9)
    split-ratio = 0.5
    # Which window the new window splits: focused|cursor
    split-target = 'focused'
    # How the windows that are already open when Inlay starts are arranged in every workspace, once the
    # 'on-window-detected' rules below have sent them to their workspaces: grid|row|dwindle
    startup-layout = 'grid'
    # The smallest width and height, in points, that resizing leaves to a tiling window (20 ... 500)
    min-window-size = 100

# ┌──────────────────────────────────────────────────────────────────────────────┐
#                                    MENU BAR
# └──────────────────────────────────────────────────────────────────────────────┘
# The menu bar item. See: inlay config --explain menu-bar
[menu-bar]
    enabled = true
    # pills|chips|square|minimal|dots|underline|glyphs|liquid|labels
    theme = 'liquid'
    dim-empty-workspaces = true
    show-mode = true
    # The workspaces of each monitor together, and a hollow marker on the one another monitor shows
    per-monitor = false

    # '#RRGGBB', '#RRGGBBAA', 'system-accent' or 'auto'
    [menu-bar.colors]
        accent = 'auto'
        focused = 'auto'
        occupied = 'auto'
        empty = 'auto'

    # The 'labels' theme only: the name of each workspace, shown in the focused one. The other themes ignore it
    [menu-bar.labels]
        # 1 = 'Terminals'
        # 2 = 'Code'
        # 3 = 'Browsers'
        # 4 = 'Chats'
        # 5 = 'AI'
        # 6 = 'Other'
        # 7 = 'Free'

    # The 'labels' theme only: the SF Symbol of each workspace (the names of the SF Symbols app)
    [menu-bar.symbols]
        # 1 = 'terminal'
        # 2 = 'chevron.left.forwardslash.chevron.right'
        # 3 = 'globe'
        # 4 = 'bubble.left.and.bubble.right'
        # 5 = 'sparkles'
        # 6 = 'square.grid.2x2'
        # 7 = 'circle.dashed'

# The colors of the menu bar item and of the borders: a palette with a light and a dark variant.
# system|catppuccin|tokyo-night|gruvbox|nord|rose-pine|dracula|everforest|kanagawa|oxocarbon|ayu|one-dark|mono|
# material|flexoki. See: inlay config --explain theme
[theme]
    palette = 'one-dark'
    # The color that 'material' (Material You) is made from: '#RRGGBB', 'system-accent' or 'wallpaper' (the main color
    # of the wallpaper, like matugen)
    seed = '#6750A4'
    # The wallpaper of every palette, put on the screens when the palette changes ('inlay theme set <palette>').
    # Without it, switching palettes leaves the wallpaper alone. See: inlay config --explain theme.wallpaper
    # wallpaper = '~/walls/default.jpg'
    # Commands that run when the colors change, with them in INLAY_THEME_* variables (inlay config --explain theme.on-change)
    on-change = []

    # The wallpaper of a palette, which wins over the one of every palette
    [theme.wallpapers]
        # gruvbox = '~/walls/autumn.jpg'

# ┌──────────────────────────────────────────────────────────────────────────────┐
#                                  ANIMATIONS
# └──────────────────────────────────────────────────────────────────────────────┘
# The windows slide to their place when a window opens or closes, and when one is moved with swap or move.
# See: inlay config --explain animations
[animations]
    enabled = true
    # In milliseconds (0 ... 500). 0 = no animation
    duration = 180
    # How switching workspaces slides the windows: 'horizontal' | 'vertical' | 'auto' | 'off'
    workspace-switch = 'horizontal'
    # The timing curve: ease-out | linear | ease | ease-in-out | snappy | overshot, or one of [animations.curves].
    # Each kind of animation can have its own: open, move, fullscreen and workspace (inlay config --explain animations)
    curve = 'ease-out'
    # open = { curve = 'overshot', duration = 220 }

# A notice in the corner of the screen when the config is reloaded: 'diff' (with the keys that changed),
# 'simple' or 'off'. See: inlay config --explain notifications
[notifications]
    on-reload = 'diff'

# The Settings window: every row shows the key of the config it writes. Without it, a key shows while the mouse
# is over its row, or while the option key is held
[settings]
    show-keys = false

# ┌──────────────────────────────────────────────────────────────────────────────┐
#                                    BORDERS
# └──────────────────────────────────────────────────────────────────────────────┘
# The borders of the windows. See: inlay config --explain borders
[borders]
    enabled = true
    # In points (1 ... 20)
    width = 4
    # In points (0 ... 40)
    corner-radius = 16
    # The border fills the rounded corners of the windows, which then look square
    square-corners = true
    # '#RRGGBB', '#RRGGBBAA' or 'system-accent'
    active-color = 'system-accent'
    inactive-color = '#8E8E9373'
    floating-color = '#BF5AF2'
    glow = false
    # In points (1 ... 40)
    glow-radius = 12
    # No border around the only tiling window of a workspace, also with the gaps around it. With
    # [gaps] smart = true a single window has no border anyway
    hide-when-single = false

    # The color of the border of the focused window while a binding mode is active
    [borders.mode-colors]
        # resize = '#30D158'
        # service = '#FF453A'

# ┌──────────────────────────────────────────────────────────────────────────────┐
#                                    KEY BINDINGS
# └──────────────────────────────────────────────────────────────────────────────┘
[mode.main.binding]
    # All the windows of the workspace get the same share of their containers again, after resizing them
    cmd-alt-comma = 'balance-sizes'

    # Go to workspace. 1 2 3 on the home row, 7 4 5 6 on the row above (see
    # the WORKSPACES note):
    #   u i o p  ->  7 4 5 6
    #   j k l    ->  1 2 3
    cmd-alt-ctrl-j = ['workspace 1', 'mode main'] # terminals
    cmd-alt-ctrl-k = ['workspace 2', 'mode main'] # code / editors
    cmd-alt-ctrl-l = ['workspace 3', 'mode main'] # browsers
    cmd-alt-ctrl-i = ['workspace 4', 'mode main'] # chats (slack, teams, whatsapp, telegram)
    cmd-alt-ctrl-o = ['workspace 5', 'mode main'] # AI
    cmd-alt-ctrl-p = ['workspace 6', 'mode main'] # everything else / secondary display
    cmd-alt-ctrl-7 = ['workspace 7', 'mode main'] # empty: no app goes there on its own

    # Move window to workspace (same keys as above). It also becomes a tiling window: the windows of the
    # apps without a workspace open floating (see WORKSPACES ASSIGNMENT), and these keys put them in the
    # layout, also in the workspace that is on the screen
    cmd-alt-shift-j = ['layout tiling', 'move-node-to-workspace 1'] # terminals
    cmd-alt-shift-k = ['layout tiling', 'move-node-to-workspace 2'] # code / editors
    cmd-alt-shift-l = ['layout tiling', 'move-node-to-workspace 3'] # browsers
    cmd-alt-shift-i = ['layout tiling', 'move-node-to-workspace 4'] # chats
    cmd-alt-shift-o = ['layout tiling', 'move-node-to-workspace 5'] # AI
    cmd-alt-shift-p = ['layout tiling', 'move-node-to-workspace 6'] # everything else / secondary
    cmd-alt-shift-7 = ['layout tiling', 'move-node-to-workspace 7'] # empty

    # focus
    cmd-alt-left  = 'focus left'
    cmd-alt-down  = 'focus down'
    cmd-alt-up    = 'focus up'
    cmd-alt-right = 'focus right'

    # Swap the focused window with its neighbor: the two windows trade places, the layout keeps its shape.
    # Toward two windows (from the right column to a left column with two), the one focused more recently
    cmd-alt-ctrl-left  = 'swap left'
    cmd-alt-ctrl-down  = 'swap down'
    cmd-alt-ctrl-up    = 'swap up'
    cmd-alt-ctrl-right = 'swap right'

    # Move the focused window: it leaves its column or row and the layout changes its shape
    cmd-alt-shift-left  = 'move left'
    cmd-alt-shift-down  = 'move down'
    cmd-alt-shift-up    = 'move up'
    cmd-alt-shift-right = 'move right'

    cmd-alt-ctrl-enter = ['fullscreen']

    # Modes: [m]anage (service) and resize with [n] beside it.
    cmd-alt-ctrl-m = 'mode service'

    cmd-alt-ctrl-n = 'mode resize'


[mode.service.binding]
    esc = ['reload-config', 'mode main']
    cmd-alt-ctrl-m = 'mode main' # the key that entered the mode leaves it (toggle)
    r   = ['flatten-workspace-tree', 'mode main'] # reset layout
    # Every window back to the workspace of its app: the 'on-window-detected' rules below run again for all
    # the open windows. They place a window only when it opens, and after waking up plugged to an external
    # display some windows turn up on a workspace that is not theirs.
    # It runs every rule, so a window that was moved or made floating on purpose goes back too, and the
    # tiling windows of the apps without a workspace float again
    w   = ['run-callback on-window-detected --for-every-window', 'mode main']
    # Toggle the focused window between floating and tiling. Rescues a window
    # Inlay mistook for a popup (it floats behind the tiled ones).
    f   = ['layout floating tiling', 'mode main']

    cmd-alt-ctrl-left  = ['join-with left', 'mode main']
    cmd-alt-ctrl-down  = ['join-with down', 'mode main']
    cmd-alt-ctrl-up    = ['join-with up', 'mode main']
    cmd-alt-ctrl-right = ['join-with right', 'mode main']

[mode.resize.binding]
    esc = ['reload-config', 'mode main']
    cmd-alt-ctrl-n = 'mode main' # the key that entered the mode leaves it (toggle)
    r   = ['flatten-workspace-tree', 'mode main'] # reset layout

    cmd-alt-ctrl-up = 'resize smart +50'
    cmd-alt-ctrl-down = 'resize smart -50'

# ┌──────────────────────────────────────────────────────────────────────────────┐
#                                    WORKSPACES ASSIGNMENT
# └──────────────────────────────────────────────────────────────────────────────┘
# The rules run for every new window, and also for the windows that are already open when Inlay starts:
# they are sent to their workspaces first, and then every workspace is arranged (see 'startup-layout').
# They are checked from top to bottom, and the first one that matches a window is the only one that
# runs for it (no rule here has 'check-further-callbacks = true'). So the order matters:
#
#   1. File dialogs float where they open
#   2. The apps with a workspace go to it: 1 to 5
#   3. The quick apps, and the settings windows of any app, float where they open
#   4. Every other window floats where it opens, until cmd-alt-shift + a workspace key tiles it there
#
# Every rule starts with 'layout tiling'. Some apps (Zen, Teams) expose incomplete
# accessibility attributes while restoring windows on wake/unlock, so Inlay
# takes them for popups and leaves them floating. `move-node-to-workspace` alone
# keeps them floating, hidden behind the tiled windows of the workspace.

# ┌────────────────────┐
#   File dialogs
# └────────────────────┘
# The Open / Save panel an app shows to pick a file or a folder (Zed's "Open",
# VS Code's "Open Folder") is that app's own window, not Finder's, so it would
# match the app's rule below and be forced into a column by its 'layout
# tiling'. It is told apart by its exact title -- the whole title, so a
# project or a document merely starting with "Open" still tiles -- and has to
# come before every app rule, since Inlay stops at the first match. English
# and Spanish titles, for either system language.
[[on-window-detected]]
if.window-title-regex-substring = '(?i)^(open|open file|open folder|open file or folder|open workspace from file|add folder to workspace|save|save as|save workspace|choose|select|abrir|abrir archivo|abrir carpeta|guardar|guardar como|elegir|seleccionar)( ?…|\.\.\.)?$'
run = ['layout floating']


# ┌────────────────────┐
#   1 · Terminal
# └────────────────────┘
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['layout tiling', 'move-node-to-workspace 1']


# ┌────────────────────┐
#   2 · Code
# └────────────────────┘
[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = ['layout tiling', 'move-node-to-workspace 2']

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode' # VsCode
run = ['layout tiling', 'move-node-to-workspace 2']

# ┌────────────────────┐
#   3 · Browsers
# └────────────────────┘
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = ['layout tiling', 'move-node-to-workspace 3']

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = ['layout tiling', 'move-node-to-workspace 3']

# ┌────────────────────┐
#   4 · Chat
# └────────────────────┘
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['layout tiling', 'move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = ['layout tiling', 'move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'ru.keepcoder.Telegram'
run = ['layout tiling', 'move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = ['layout tiling', 'move-node-to-workspace 4']


# ┌────────────────────┐
#   5 · AI
# └────────────────────┘
[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop' # Claude
run = ['layout tiling', 'move-node-to-workspace 5']

# ┌────────────────────┐
#   Floating Apps
# └────────────────────┘
# Quick, fixed-size or occasional windows float where they open instead of
# taking a column: no workspace of their own, and the tiling around them is
# left alone.
[[on-window-detected]]
if.app-id = 'com.apple.finder' # Finder: a folder opened from another app floats instead of reflowing the workspace
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences' # System Settings
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.SystemProfiler' # System Information
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor' # Activity Monitor
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.Stickies' # Stickies: a note kept over the browser during a call
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.calculator' # Calculator
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.Preview' # Preview: images and PDFs opened from other apps
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.DiskUtility' # Disk Utility
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.QuickTimePlayerX' # QuickTime Player
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.archiveutility' # Archive Utility
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.1password.1password' # 1Password
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.raycast.macos' # Raycast (its settings window)
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.if.Amphetamine' # Amphetamine
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'info.marcel-dierkes.KeepingYouAwake' # KeepingYouAwake
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'net.freemacsoft.AppCleaner' # AppCleaner
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'cx.c3.theunarchiver' # The Unarchiver
run = ['layout floating']

# Settings and preferences windows of any other app, by title. The app rules
# above come first, so an app sent to a workspace keeps its own rule.
[[on-window-detected]]
if.window-title-regex-substring = '(?i)(settings|preferences)'
run = ['layout floating']

# ┌────────────────────┐
#   Everything else
# └────────────────────┘
# The windows of the apps that have no rule above float where they open, in the workspace that is on the
# screen, instead of taking a place in its layout. cmd-alt-shift + a workspace key (j k l i o p u) puts the
# window in the layout of that workspace, also of the one that is on the screen: it stops floating.
#
# Only the windows that Inlay tiles. What Inlay takes for a dialog (a sheet, an alert, an "About" window)
# floats, so 'window-layout' is 'floating' for it, the rule doesn't match, and it stays where it opens.
# Popups (menus, tooltips) never get to the rules.
#
# It has to be the last rule: Inlay stops at the first one that matches, so it only sees the windows
# that none of the rules above wanted. To give an app a place of its own, give it a rule above: a workspace
# of its own, for instance. To have every other window tiled in the workspace where it opens, as AeroSpace
# does, delete this rule.
[[on-window-detected]]
if = 'test %{window-layout} ~= _tiles' # h_tiles or v_tiles: a tiling window
run = 'layout floating'

# ┌──────────────────────────────────────────────────────────────────────────────┐
#                                    MONITORS
# └──────────────────────────────────────────────────────────────────────────────┘
# Monitors are matched by role instead of by name or index, so the same rules
# hold whichever display is plugged in:
#
#   1 to 5, 7 -> the main display (the one macOS has as "main display")
#   6         -> the other one
#
#   Studio Display as main + MacBook    1-5 and 7 on the Studio Display, 6 on the MacBook
#   MacBook as main + a portable one    1-5 and 7 on the MacBook, 6 on the portable
#   MacBook alone                       all seven on the MacBook
#
# 'secondary' only matches with exactly two displays, hence the 'main'
# fallback: alone, or with three, 6 stays on the main display. Which display is
# the main one is set in System Settings > Displays.
[workspace-to-monitor-force-assignment]
'1' = 'main'                  # Terminal
'2' = 'main'                  # Code
'3' = 'main'                  # Browser
'4' = 'main'                  # Chat
'5' = 'main'                  # AI
'6' = ['secondary', 'main']   # Everything else
'7' = 'main'                  # Empty
