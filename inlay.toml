# Inlay config
#
# Inlay reloads this file when you save it. Every key, its values and its default:
#     inlay config --explain [<key>]          (also in docs/config-reference.toml)
#
# Sections
#    1  General                 6  Menu bar
#    2  Callbacks               7  Borders
#    3  Workspaces & monitors   8  Programs
#    4  Layout                  9  Key bindings
#    5  Animations             10  Window rules
#
# TOML puts the keys without a [table] first: sections 1 to 3 start with them.

# ━━ 1 · General ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

config-version     = 2
start-at-login     = true
auto-reload-config = true    # reload when this file is saved

# Commands that run after Inlay starts
after-startup-command = []

# Show again the apps hidden with cmd-h, if you hit it by accident
automatically-unhide-macos-hidden-apps = false

# Normalizations: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers                         = true
enable-normalization-opposite-orientation-for-nested-containers = true

# tiles · horizontal | vertical | auto (by the shape of the monitor)
default-root-container-layout      = 'tiles'
default-root-container-orientation = 'horizontal'

# ━━ 2 · Callbacks ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# The mouse follows the focus. Empty them to turn it off
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed           = ['move-mouse window-lazy-center']

# Commands that run when the binding mode changes
on-mode-changed = []

# A program (and its arguments) that runs when the focused workspace changes. For example:
#     ['/bin/bash', '-c', 'echo $INLAY_FOCUSED_WORKSPACE >> /tmp/workspaces']
exec-on-workspace-change = []

# ━━ 3 · Workspaces & monitors ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

#   ws  for           go to / move window to          monitor
#   1   Terminals     cmd-alt-ctrl-h / cmd-alt-shift-h   main
#   2   Code          cmd-alt-ctrl-j / cmd-alt-shift-j   main
#   3   Browsers      cmd-alt-ctrl-k / cmd-alt-shift-k   main
#   4   Chats         cmd-alt-ctrl-l / cmd-alt-shift-l   main
#   5   AI            cmd-alt-ctrl-u / cmd-alt-shift-u   main
#   6   Other         cmd-alt-ctrl-i / cmd-alt-shift-i   secondary, or main
#   7   Free          cmd-alt-ctrl-o / cmd-alt-shift-o   main
#
# The keys follow the right hand:   u i o -> 5 6 7
#                                 h j k l -> 1 2 3 4
# 7 has no app rule: there is (almost) always a free workspace.
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7']

# Monitors by role, not by name: the same rules hold whatever display is plugged in.
# 'secondary' only matches with exactly two displays, hence the 'main' fallback for 6.
# The main display is set in System Settings › Displays.
[workspace-to-monitor-force-assignment]
    '1' = 'main'
    '2' = 'main'
    '3' = 'main'
    '4' = 'main'
    '5' = 'main'
    '6' = ['secondary', 'main']
    '7' = 'main'

# ━━ 4 · Layout ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# In points. The borders are drawn in the gaps: keep a gap at least twice borders.width,
# or the borders of two neighbor windows overlap
[gaps]
    inner.horizontal = 8
    inner.vertical   = 8
    outer.left       = 8
    outer.right      = 8
    outer.top        = 8
    outer.bottom     = 8

[tiling]
    new-window-placement = 'dwindle'    # dwindle | after-focused (i3 style)
    split-target         = 'focused'    # the window a new one splits: focused | cursor
    split-ratio          = 0.5          # what the split window keeps: 0.1 … 0.9
    startup-layout       = 'grid'       # the windows open at startup: grid | row | dwindle
    min-window-size      = 100          # points left by resizing: 20 … 500

[focus-follows-mouse]
    enabled = false

# ━━ 5 · Animations ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Curves: quint | expo | quick | ease-out | linear | ease | ease-in-out | snappy | overshot,
# or one of [animations.curves]. A strong ease-out hides the frames that other apps skip;
# a curve that overshoots makes them lay out again
[animations]
    enabled          = true
    duration         = 160             # ms: 0 … 500
    curve            = 'quint'
    workspace-switch = 'horizontal'    # horizontal | vertical | auto | off

    # Per kind of animation; without them, curve and duration above
    open       = { curve = 'quint', duration = 200 }
    move       = { curve = 'quint', duration = 160 }
    fullscreen = { curve = 'expo',  duration = 220 }
    workspace  = { curve = 'expo',  duration = 140 }    # workspace-switch = 'off' if it stutters

# Curves of your own: name = [x1, y1, x2, y2]
[animations.curves]
    # bounce = [0.34, 1.56, 0.64, 1]

# ━━ 6 · Menu bar ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[menu-bar]
    enabled              = true
    # pills | chips | square | minimal | dots | underline | glyphs
    # liquid | labels | segments | capsule
    theme                = 'liquid'
    dim-empty-workspaces = true
    show-mode            = true        # the initial of the binding mode on the focused workspace
    per-monitor          = false       # group the workspaces by monitor
    system-colors        = false       # draw it like the other menu bar icons, ignoring the colors

# '#RRGGBB', '#RRGGBBAA', 'system-accent' or 'auto' (the color of the menu bar text)
[menu-bar.colors]
    focused  = 'auto'
    occupied = 'auto'    # workspaces with windows
    empty    = 'auto'    # workspaces without windows
    accent   = 'auto'    # the focused one in a binding mode. 'auto': as focused

# Only for theme = 'labels'
[menu-bar.labels]
    # 1 = 'Terminals'
    # 2 = 'Code'
    # 3 = 'Browsers'
    # 4 = 'Chats'
    # 5 = 'AI'
    # 6 = 'Other'
    # 7 = 'Free'

# Only for theme = 'labels'. Names from the SF Symbols app
[menu-bar.symbols]
    # 1 = 'terminal'
    # 2 = 'chevron.left.forwardslash.chevron.right'
    # 3 = 'globe'
    # 4 = 'bubble.left.and.bubble.right'
    # 5 = 'sparkles'
    # 6 = 'square.grid.2x2'
    # 7 = 'circle.dashed'

# ━━ 7 · Borders ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Colors: '#RRGGBB', '#RRGGBBAA' or 'system-accent'
[borders]
    enabled        = true
    width          = 4                  # points: 1 … 20
    corner-radius  = 16                 # points: 0 … 40
    square-corners = true               # fill the rounded corners of the windows
    active-color   = 'system-accent'
    inactive-color = '#8E8E9373'
    floating-color = '#BF5AF2'
    glow           = false
    glow-radius    = 12                 # points: 1 … 40

# The focused window while a binding mode is active
[borders.mode-colors]
    # resize  = '#30D158'
    # service = '#FF453A'

# A window alone in its workspace, or in fullscreen: a thin border and a small gap.
# enabled = false: it fills the screen without a border
[borders.single-window]
    enabled = true
    width   = 1                         # points: 1 … 20
    gap     = 2                         # points: 0 … 40, never less than width

# ━━ 8 · Programs ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# The environment of exec-and-forget and exec-on-workspace-change
[exec]
    inherit-env-vars = true

# ${NAME} is replaced by the value of the variable
[exec.env-vars]
    PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

# ━━ 9 · Key bindings ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

#   cmd-alt-ctrl  + right hand   go to a workspace        (see section 3)
#   cmd-alt-shift + right hand   move the window there
#   cmd-alt-shift + left hand    an action
#   arrows: cmd-alt focus · cmd-alt-ctrl swap · cmd-alt-shift move

# The layout the names of the keys refer to: qwerty | dvorak | colemak
[key-mapping]
    preset = 'qwerty'
    key-notation-to-key-code = {}    # names of your own, e.g. { unicorn = 'q' }

[mode.main.binding]
    # ── Workspaces
    cmd-alt-ctrl-h = ['workspace 1', 'mode main']
    cmd-alt-ctrl-j = ['workspace 2', 'mode main']
    cmd-alt-ctrl-k = ['workspace 3', 'mode main']
    cmd-alt-ctrl-l = ['workspace 4', 'mode main']
    cmd-alt-ctrl-u = ['workspace 5', 'mode main']
    cmd-alt-ctrl-i = ['workspace 6', 'mode main']
    cmd-alt-ctrl-o = ['workspace 7', 'mode main']

    # ── Move the window to a workspace. It keeps floating or tiling; fullscreen ends
    cmd-alt-shift-h = 'move-node-to-workspace 1'
    cmd-alt-shift-j = 'move-node-to-workspace 2'
    cmd-alt-shift-k = 'move-node-to-workspace 3'
    cmd-alt-shift-l = 'move-node-to-workspace 4'
    cmd-alt-shift-u = 'move-node-to-workspace 5'
    cmd-alt-shift-i = 'move-node-to-workspace 6'
    cmd-alt-shift-o = 'move-node-to-workspace 7'

    # ── Actions
    cmd-alt-shift-b     = 'balance-sizes'                               # [b]alance
    cmd-alt-shift-d     = 'arrange-workspace dwindle'                   # [d]windle (or grid, row)
    cmd-alt-shift-f     = ['fullscreen off', 'layout floating tiling']  # [f]loating ⇄ tiling
    cmd-alt-shift-enter = 'fullscreen'
    cmd-alt-shift-s     = 'mode service'                                # [s]ervice mode
    cmd-alt-shift-r     = 'mode resize'                                 # [r]esize mode

    # ── Focus
    cmd-alt-left  = 'focus left'
    cmd-alt-down  = 'focus down'
    cmd-alt-up    = 'focus up'
    cmd-alt-right = 'focus right'

    # ── Swap with the neighbor: the layout keeps its shape
    cmd-alt-ctrl-left  = 'swap left'
    cmd-alt-ctrl-down  = 'swap down'
    cmd-alt-ctrl-up    = 'swap up'
    cmd-alt-ctrl-right = 'swap right'

    # ── Move: the window leaves its column or row, the layout changes
    cmd-alt-shift-left  = 'move left'
    cmd-alt-shift-down  = 'move down'
    cmd-alt-shift-up    = 'move up'
    cmd-alt-shift-right = 'move right'

[mode.service.binding]
    esc             = ['reload-config', 'mode main']
    cmd-alt-shift-s = 'mode main'                                     # leave (toggle)
    r               = ['flatten-workspace-tree', 'mode main']         # reset the layout
    f               = ['layout floating tiling', 'mode main']         # rescue a "popup"
    # Every window back to the workspace of its app (after waking up with an external display).
    # It runs every rule: windows moved or floated on purpose go back too
    w               = ['run-callback on-window-detected --for-every-window', 'mode main']

    cmd-alt-ctrl-left  = ['join-with left', 'mode main']
    cmd-alt-ctrl-down  = ['join-with down', 'mode main']
    cmd-alt-ctrl-up    = ['join-with up', 'mode main']
    cmd-alt-ctrl-right = ['join-with right', 'mode main']

[mode.resize.binding]
    esc             = ['reload-config', 'mode main']
    cmd-alt-shift-r = 'mode main'                                     # leave (toggle)
    r               = ['flatten-workspace-tree', 'mode main']         # reset the layout

    cmd-alt-ctrl-up   = 'resize smart +50'
    cmd-alt-ctrl-down = 'resize smart -50'

# ━━ 10 · Window rules ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# They run for every new window and for the ones open at startup. The first rule that matches
# is the only one that runs, so the order matters:
#   a. File dialogs float
#   b. Apps with a workspace go to it (1 to 5)
#   c. Quick apps and settings windows float
#   d. Everything else floats where it opens (cmd-alt-shift-f tiles it)
# 'layout tiling' first: some apps (Zen, Teams) look like popups while they restore their windows.

# ── a · File dialogs ──────────────────────────────────────────────────────────────────────
# The whole title, in English and Spanish: a document that only starts with "Open" still tiles
[[on-window-detected]]
    if.window-title-regex-substring = '(?i)^(open|open file|open folder|open file or folder|open workspace from file|add folder to workspace|save|save as|save workspace|choose|select|abrir|abrir archivo|abrir carpeta|guardar|guardar como|elegir|seleccionar)( ?…|\.\.\.)?$'
    run = ['layout floating']

# ── b · 1 Terminals ───────────────────────────────────────────────────────────────────────
[[on-window-detected]]
    if.app-id = 'com.mitchellh.ghostty'               # Ghostty
    run = ['layout tiling', 'move-node-to-workspace 1']

# ── b · 2 Code ────────────────────────────────────────────────────────────────────────────
[[on-window-detected]]
    if.app-id = 'dev.zed.Zed'                         # Zed
    run = ['layout tiling', 'move-node-to-workspace 2']

[[on-window-detected]]
    if.app-id = 'com.microsoft.VSCode'                # VS Code
    run = ['layout tiling', 'move-node-to-workspace 2']

# ── b · 3 Browsers ────────────────────────────────────────────────────────────────────────
[[on-window-detected]]
    if.app-id = 'com.google.Chrome'                   # Chrome
    run = ['layout tiling', 'move-node-to-workspace 3']

[[on-window-detected]]
    if.app-id = 'app.zen-browser.zen'                 # Zen
    run = ['layout tiling', 'move-node-to-workspace 3']

# ── b · 4 Chats ───────────────────────────────────────────────────────────────────────────
[[on-window-detected]]
    if.app-id = 'com.tinyspeck.slackmacgap'           # Slack
    run = ['layout tiling', 'move-node-to-workspace 4']

[[on-window-detected]]
    if.app-id = 'com.microsoft.teams2'                # Teams
    run = ['layout tiling', 'move-node-to-workspace 4']

[[on-window-detected]]
    if.app-id = 'ru.keepcoder.Telegram'               # Telegram
    run = ['layout tiling', 'move-node-to-workspace 4']

[[on-window-detected]]
    if.app-id = 'net.whatsapp.WhatsApp'               # WhatsApp
    run = ['layout tiling', 'move-node-to-workspace 4']

# ── b · 5 AI ──────────────────────────────────────────────────────────────────────────────
[[on-window-detected]]
    if.app-id = 'com.anthropic.claudefordesktop'      # Claude
    run = ['layout tiling', 'move-node-to-workspace 5']

# ── c · Floating apps ─────────────────────────────────────────────────────────────────────
# Quick, fixed-size or occasional windows: no workspace, and the tiling around them stays
[[on-window-detected]]
    if.app-id = 'com.apple.finder'                    # Finder
    run = ['layout floating']

[[on-window-detected]]
    if.app-id = 'com.apple.systempreferences'         # System Settings
    run = ['layout floating']

[[on-window-detected]]
    if.app-id = 'com.apple.SystemProfiler'            # System Information
    run = ['layout floating']

[[on-window-detected]]
    if.app-id = 'com.apple.ActivityMonitor'           # Activity Monitor
    run = ['layout floating']

[[on-window-detected]]
    if.app-id = 'com.apple.Stickies'                  # Stickies
    run = ['layout floating']

[[on-window-detected]]
    if.app-id = 'com.apple.calculator'                # Calculator
    run = ['layout floating']

[[on-window-detected]]
    if.app-id = 'com.apple.Preview'                   # Preview
    run = ['layout floating']

[[on-window-detected]]
    if.app-id = 'com.apple.DiskUtility'               # Disk Utility
    run = ['layout floating']

[[on-window-detected]]
    if.app-id = 'com.apple.QuickTimePlayerX'          # QuickTime Player
    run = ['layout floating']

[[on-window-detected]]
    if.app-id = 'com.apple.archiveutility'            # Archive Utility
    run = ['layout floating']

[[on-window-detected]]
    if.app-id = 'com.1password.1password'             # 1Password
    run = ['layout floating']

[[on-window-detected]]
    if.app-id = 'com.raycast.macos'                   # Raycast (its settings window)
    run = ['layout floating']

[[on-window-detected]]
    if.app-id = 'com.if.Amphetamine'                  # Amphetamine
    run = ['layout floating']

[[on-window-detected]]
    if.app-id = 'info.marcel-dierkes.KeepingYouAwake' # KeepingYouAwake
    run = ['layout floating']

[[on-window-detected]]
    if.app-id = 'net.freemacsoft.AppCleaner'          # AppCleaner
    run = ['layout floating']

[[on-window-detected]]
    if.app-id = 'cx.c3.theunarchiver'                 # The Unarchiver
    run = ['layout floating']

# The settings windows of any other app, by title
[[on-window-detected]]
    if.window-title-regex-substring = '(?i)(settings|preferences)'
    run = ['layout floating']

# ── d · Everything else ───────────────────────────────────────────────────────────────────
# Must be the last rule. A tiling window of an app without a rule floats where it opens.
# Dialogs already float and popups never get here. Delete it to tile everything, like AeroSpace
[[on-window-detected]]
    if = 'test %{window-layout} ~= _tiles'
    run = 'layout floating'
